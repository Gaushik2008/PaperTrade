<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PaperTrade</title>
<style>
:root{--bg:#0b0d10;--card:#14181d;--tx:#e8ecf1;--mu:#8a94a3;--up:#2fbf71;--dn:#ef4f5f;--ac:#6ea8fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6f9;--card:#fff;--tx:#14181d;--mu:#5d6775;--ac:#2563eb}}
:root[data-theme="dark"]{--bg:#0b0d10}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:16px;max-width:1000px;margin:auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;margin:0 0 8px;color:var(--mu);font-weight:600}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.c{background:var(--card);border-radius:10px;padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mu);font-weight:500}
.up{color:var(--up)}.dn{color:var(--dn)}button,input,select{font:inherit;padding:5px 9px;border-radius:6px;border:1px solid var(--mu);background:var(--card);color:var(--tx)}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.big{font-size:22px;font-weight:700}.mu{color:var(--mu)}canvas{width:100%;height:90px}
</style></head><body>
<h1>PaperTrade</h1><div class="mu" id="mode">Simulated feed · virtual money only, no real funds</div><br>
<div class="g">
<div class="c"><h2>Your account</h2><div class="big" id="eq"></div><div class="mu" id="cash"></div><div id="pnl"></div><br>
<select id="sym"></select> <input id="qty" type="number" min="1" value="10" style="width:70px"> <button class="p" onclick="trade(you,1)">Buy</button> <button onclick="trade(you,-1)">Sell</button><div class="mu" id="msg"></div></div>
<div class="c"><h2>Market (NSE, ₹)</h2><table id="mk"></table></div>
<div class="c"><h2>Positions</h2><table id="pos"></table></div>
</div><br>
<div class="c"><h2>Trading agents — each starts with ₹10,00,000</h2>
<button class="p" onclick="train()">Train agents (200 episodes)</button> <button onclick="reset()">Reset all</button> <span class="mu" id="tr"></span>
<table id="ag"></table><canvas id="cv" width="900" height="90"></canvas></div>
<script>
const CAP=1e6,S={RELIANCE:2900,TCS:4100,INFY:1850,HDFCBANK:1700,ICICIBANK:1250,SBIN:820,ITC:470,LT:3600};
const API=''; /* set to your proxy URL of Indian-Stock-Market-API; blocked in this hosted preview, so simulation is used */
const inr=n=>'₹'+n.toLocaleString('en-IN',{maximumFractionDigits:0});
let px,hist,t;const mkP=()=>({cash:CAP,pos:{}});
let you=mkP();
const A=[{n:'Momentum',p:{lb:5,th:0.004},f:(h,p)=>{const r=h[h.length-1]/h[h.length-1-p.lb]-1;return r>p.th?1:r<-p.th?-1:0}},
{n:'Mean reversion',p:{lb:10,th:0.01},f:(h,p)=>{const m=h.slice(-p.lb).reduce((a,b)=>a+b)/p.lb,d=h[h.length-1]/m-1;return d<-p.th?1:d>p.th?-1:0}},
{n:'Random',p:{},f:()=>[1,-1,0][Math.random()*3|0]}];
A.forEach(a=>a.pf=mkP());
const eqty=(pf,P)=>pf.cash+Object.entries(pf.pos).reduce((s,[k,q])=>s+q*P[k],0);
function exec(pf,P,s,q,side){if(side>0){const c=P[s]*q;if(c>pf.cash)return'Insufficient virtual cash';pf.cash-=c;pf.pos[s]=(pf.pos[s]||0)+q}else{if((pf.pos[s]||0)<q)return'Not enough shares';pf.cash+=P[s]*q;pf.pos[s]-=q}return''}
function trade(pf,side){const q=+qty.value|0;if(q<1)return;const e=exec(pf,px,sym.value,q,side);msg.textContent=e||`${side>0?'Bought':'Sold'} ${q} ${sym.value} @ ${inr(px[sym.value])}`;draw()}
const step=(P)=>{for(const k in P)P[k]=Math.max(1,P[k]*(1+(Math.random()-.5)*.008+.0001))};
function agentAct(a,pf,H,P,size){for(const s in P){const h=H[s];if(h.length<=Math.max(a.p.lb||2,12))continue;const d=a.f(h,a.p);if(d)exec(pf,P,s,Math.max(1,Math.floor(size/P[s])),d)}}
function reset(){px={...S};hist={};for(const k in S)hist[k]=[S[k]];you=mkP();A.forEach(a=>a.pf=mkP());curve=[];draw()}
let curve=[];
function draw(){const e=eqty(you,px);eq.textContent=inr(e);cash.textContent='Cash '+inr(you.cash);pnl.innerHTML=`<span class="${e>=CAP?'up':'dn'}">${e>=CAP?'+':''}${inr(e-CAP)}</span>`;
mk.innerHTML='<tr><th>Symbol<th>Price<th>Chg</tr>'+Object.keys(S).map(k=>{const c=px[k]/S[k]-1;return`<tr><td>${k}<td>${px[k].toFixed(2)}<td class="${c>=0?'up':'dn'}">${(c*100).toFixed(2)}%</tr>`}).join('');
pos.innerHTML='<tr><th>Symbol<th>Qty<th>Value</tr>'+(Object.entries(you.pos).filter(x=>x[1]>0).map(([k,q])=>`<tr><td>${k}<td>${q}<td>${inr(q*px[k])}</tr>`).join('')||'<tr><td colspan=3 class="mu">No positions</tr>');
ag.innerHTML='<tr><th>Agent<th>Params<th>Equity<th>P&amp;L</tr>'+A.map(a=>{const q=eqty(a.pf,px)-CAP;return`<tr><td>${a.n}<td class="mu">${JSON.stringify(a.p).replace(/"/g,'')}<td>${inr(eqty(a.pf,px))}<td class="${q>=0?'up':'dn'}">${inr(q)}</tr>`}).join('');
const c=cv.getContext('2d');c.clearRect(0,0,900,90);const all=curve.flat();if(!all.length)return;const lo=Math.min(...all,CAP),hi=Math.max(...all,CAP);
['#6ea8fe','#2fbf71','#8a94a3'].forEach((col,i)=>{c.beginPath();c.strokeStyle=col;curve.forEach((r,j)=>{const x=j/Math.max(1,curve.length-1)*900,y=85-(r[i]-lo)/(hi-lo||1)*80;j?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()})}
function episode(a,p,len=120){const P={...S},H={};for(const k in S)H[k]=[S[k]];const pf=mkP(),b={...a,p};for(let i=0;i<len;i++){step(P);for(const k in P)H[k].push(P[k]);agentAct(b,pf,H,P,CAP*.05)}return eqty(pf,P)-CAP}
function train(){tr.textContent='Training…';setTimeout(()=>{const out=[];A.slice(0,2).forEach(a=>{let best=a.p,bs=-1e18;for(let i=0;i<200;i++){const c={lb:3+Math.random()*20|0,th:.001+Math.random()*.02};let s=0;for(let k=0;k<5;k++)s+=episode(a,c)/5;if(s>bs){bs=s;best=c}}a.p=best;out.push(`${a.n}: avg ${inr(bs)}`)});tr.textContent='Done · '+out.join(' · ');draw()},30)}
Object.keys(S).forEach(k=>sym.add(new Option(k,k)));
reset();setInterval(()=>{step(px);for(const k in px){hist[k].push(px[k]);if(hist[k].length>200)hist[k].shift()}A.forEach(a=>agentAct(a,a.pf,hist,px,CAP*.05));curve.push(A.map(a=>eqty(a.pf,px)));if(curve.length>300)curve.shift();draw()},1500);
</script></body></html>
